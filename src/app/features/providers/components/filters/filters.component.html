<div class="sticky top-28 space-y-8">
  <th-card class="p-6">
    <h3 class="th-heading-6 mb-6 text-on-surface">Filtros</h3>
    <div class="mb-8">
      <label class="th-caption mb-4 tracking-wider text-outline">
        Categoría
      </label>
    </div>
    <div class="mb-8">
      <label class="th-caption mb-4 tracking-wider text-outline">
        Ubicación
      </label>
    </div>
    <div class="mb-8">
      <label class="th-caption mb-4 tracking-wider text-outline">
        Rango de Precio
      </label>
    </div>
    <div class="mb-8">
      <label class="th-caption mb-4 tracking-wider text-outline">
        Calificación
      </label>
    </div>
    <button th-btn="tonal" [th-btn-full-width]="true">Limpiar Filtros</button>
  </th-card>
</div>
